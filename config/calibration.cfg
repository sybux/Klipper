#####################################################################
#  calibration.cfg — macros d'aide au réglage (Voron 0.1)
#  Inclure depuis printer.cfg :   [include calibration.cfg]
#####################################################################

# Requis pour FORCE_MOVE / SET_KINEMATIC_POSITION
[force_move]
enable_force_move: True

[respond]


#####################################################################
#  Diagnostic drivers
#####################################################################

[gcode_macro TMC_STATUS]
description: DUMP_TMC sur tous les axes d'un coup
gcode:
    RESPOND MSG="===== stepper_x ====="
    DUMP_TMC STEPPER=stepper_x
    RESPOND MSG="===== stepper_y ====="
    DUMP_TMC STEPPER=stepper_y
    RESPOND MSG="===== stepper_z ====="
    DUMP_TMC STEPPER=stepper_z
    RESPOND MSG="===== extruder ====="
    DUMP_TMC STEPPER=extruder
    RESPOND MSG="Rappel : ola/olb ne sont valides QU'EN MOUVEMENT (enn=0)"

[gcode_macro TMC_STATUS_MOVING]
description: Dump du driver pendant un mouvement continu (usage: TMC_STATUS_MOVING AXIS=x)
gcode:
    {% set axis = params.AXIS|default('x')|lower %}
    {% set st = 'stepper_' ~ axis %}
    G90
    {% if axis == 'x' %}
        G1 X10 F600
        DUMP_TMC STEPPER={st}
        G1 X110 F600
    {% elif axis == 'y' %}
        G1 Y10 F600
        DUMP_TMC STEPPER={st}
        G1 Y110 F600
    {% else %}
        G1 Z5 F300
        DUMP_TMC STEPPER={st}
        G1 Z60 F300
    {% endif %}
    DUMP_TMC STEPPER={st}


#####################################################################
#  Chauffe
#####################################################################

[gcode_macro PID_ALL]
description: PID buse puis plateau (usage: PID_ALL HOTEND=245 BED=100)
gcode:
    {% set h = params.HOTEND|default(245)|int %}
    {% set b = params.BED|default(100)|int %}
    RESPOND MSG="PID plateau {b} C — ne pas toucher la machine"
    PID_CALIBRATE HEATER=heater_bed TARGET={b}
    RESPOND MSG="PID buse {h} C"
    PID_CALIBRATE HEATER=extruder TARGET={h}
    RESPOND MSG="Termine — lancer SAVE_CONFIG"

[gcode_macro HEAT_SOAK]
description: Trempe thermique chambre (usage: HEAT_SOAK BED=100 MINUTES=20)
gcode:
    {% set b = params.BED|default(100)|int %}
    {% set m = params.MINUTES|default(20)|int %}
    M140 S{b}
    G28
    G90
    G1 Z50 F600
    M190 S{b}
    RESPOND MSG="Trempe {m} min en cours..."
    {% for i in range(m) %}
        G4 P60000
        RESPOND MSG="Trempe : {i+1}/{m} min"
    {% endfor %}
    RESPOND MSG="Trempe terminee"


#####################################################################
#  Extrudeur — rotation_distance
#####################################################################

[gcode_macro E_TEST]
description: Extrude 100 mm lentement (usage: E_TEST TEMP=215)
gcode:
    {% set t = params.TEMP|default(215)|int %}
    {% set l = params.LENGTH|default(100)|int %}
    M109 S{t}
    M83
    G92 E0
    RESPOND MSG="Repere le filament a 120 mm de l'entree de l'extrudeur, puis attends."
    G4 P3000
    G1 E{l} F60
    RESPOND MSG="Mesure ce qu'il reste entre le repere et l'extrudeur, puis : E_CALC LEFT=<valeur>"
    M104 S0

[gcode_macro E_CALC]
description: Calcule la nouvelle rotation_distance (usage: E_CALC LEFT=19 MARK=120)
gcode:
    {% set old = printer.configfile.settings.extruder.rotation_distance|float %}
    {% set mark = params.MARK|default(120)|float %}
    {% set left = params.LEFT|float %}
    {% set target = params.TARGET|default(100)|float %}
    {% set used = mark - left %}
    {% set new = old * used / target %}
    {% set err = (used - target) / target * 100 %}
    RESPOND MSG="Consomme : {used|round(2)} mm pour {target|round(0)} demandes ({err|round(2)} %)"
    RESPOND MSG="rotation_distance : {old} -> {new|round(4)}"
    {% if err|abs < 0.5 %}
        RESPOND MSG="Ecart < 0.5 % : dans le bruit de mesure, correction facultative."
    {% endif %}


#####################################################################
#  Plateau — reglage manuel (pas de sonde sur V0.1)
#####################################################################

# Fournit la commande BED_SCREWS_ADJUST.
# ⚠ Adapter les coordonnees a TON montage de plateau 120x120 :
#    ce sont les positions ou la BUSE doit se placer, soit l'aplomb
#    de chaque vis. Verifier qu'elles restent dans X 0-120 / Y 4-120.
[bed_screws]
screw1: 15, 15
screw1_name: avant gauche
screw2: 105, 15
screw2_name: avant droit
screw3: 105, 105
screw3_name: arriere droit
screw4: 15, 105
screw4_name: arriere gauche

# Hauteur de deplacement entre deux vis
horizontal_move_z: 5
# Hauteur a laquelle la buse descend pour le test de la feuille
probe_height: 0
speed: 60
probe_speed: 5


#####################################################################
#  Z offset
#####################################################################

[gcode_macro Z_REPEATABILITY]
description: 5 homings Z successifs, affiche la position obtenue
gcode:
    {% for i in range(5) %}
        G28 Z
        GET_POSITION
        G90
        G1 Z10 F600
    {% endfor %}
    RESPOND MSG="Dispersion attendue < 0.01 mm sur la ligne 'stepper' du Z"


#####################################################################
#  Input shaper
#####################################################################

[gcode_macro SHAPER_BOTH]
description: Mesure de resonance X puis Y avec chauffe prealable
gcode:
    {% set b = params.BED|default(0)|int %}
    {% if b > 0 %}
        M190 S{b}
    {% endif %}
    G28
    RESPOND MSG="Verifie d'abord ACCELEROMETER_QUERY (~0,0,9800 au repos)"
    SHAPER_CALIBRATE AXIS=X
    SHAPER_CALIBRATE AXIS=Y
    RESPOND MSG="Termine — SAVE_CONFIG puis archiver les .csv"


#####################################################################
#  Pressure advance
#####################################################################

[gcode_macro PA_TOWER]
description: Tour de reglage PA facon Klipper (usage: PA_TOWER START=0 FACTOR=0.005)
gcode:
    {% set s = params.START|default(0)|float %}
    {% set f = params.FACTOR|default(0.005)|float %}
    SET_PRESSURE_ADVANCE ADVANCE={s}
    TUNING_TOWER COMMAND=SET_PRESSURE_ADVANCE PARAMETER=ADVANCE START={s} FACTOR={f}
    RESPOND MSG="Lance maintenant l'impression de la tour. PA = {s} + {f} x hauteur_mm"

[gcode_macro PA_FROM_HEIGHT]
description: Convertit une hauteur mesuree sur la tour en valeur de PA
gcode:
    {% set h = params.HEIGHT|float %}
    {% set s = params.START|default(0)|float %}
    {% set f = params.FACTOR|default(0.005)|float %}
    RESPOND MSG="PA = {(s + f * h)|round(4)}  (a {h} mm de hauteur)"


#####################################################################
#  Divers
#####################################################################

[gcode_macro PURGE_LINE]
description: Ligne de purge bord avant (respecte Y_MIN)
gcode:
    {% set y = printer.configfile.settings.stepper_y.position_min|float + 2 %}
    G90
    M83
    G1 Z5 F900
    G1 X5 Y{y} F6000
    G1 Z0.2 F600
    G1 E4 F300
    G1 X105 Y{y} E3.8 F1200
    G1 Y{y + 0.45} E0.02 F1200
    G1 X5 E3.8 F1500
    G1 E-0.6 F2100
    G1 Z3 F900
    G92 E0

[gcode_macro AXES_LIMITS]
description: Rappelle les limites logicielles reelles de la machine
gcode:
    {% set s = printer.configfile.settings %}
    RESPOND MSG="X : {s.stepper_x.position_min} -> {s.stepper_x.position_max}"
    RESPOND MSG="Y : {s.stepper_y.position_min} -> {s.stepper_y.position_max}"
    RESPOND MSG="Z : {s.stepper_z.position_min} -> {s.stepper_z.position_max}"
    RESPOND MSG="Surface utile a reporter dans le slicer."
